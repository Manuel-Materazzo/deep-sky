name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release versionName (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Monotonically increasing Android versionCode"
        required: true
        default: "1"

permissions:
  contents: write
  packages: write

jobs:
  build-server-image:
    name: Build & Push Server Image (ARM64 + AMD64)
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute lowercase GHCR image name
        id: meta
        run: |
          OWNER_LC=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/deep-sky-server" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch server image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ inputs.version_name }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-unsigned-release:
    name: Build Unsigned Android APK
    runs-on: ubuntu-latest
    outputs:
      unsigned_sha256: ${{ steps.bundle.outputs.unsigned_sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Verify tests before building release artifact
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build unsigned release APK (CI-02, PD-10)
        run: |
          flutter build apk --release --config-only \
            --build-name="${{ inputs.version_name }}" \
            --build-number="${{ inputs.version_code }}"
          cd android
          ./gradlew assembleRelease -Punsigned=true

      - name: Prepare unsigned release bundle
        id: bundle
        run: |
          mkdir -p release-unsigned
          cp build/app/outputs/apk/release/app-release-unsigned.apk release-unsigned/
          (cd release-unsigned && sha256sum app-release-unsigned.apk > app-release-unsigned.apk.sha256)
          UNSIGNED_SHA=$(awk '{print $1}' release-unsigned/app-release-unsigned.apk.sha256)
          echo "unsigned_sha256=${UNSIGNED_SHA}" >> "$GITHUB_OUTPUT"
          cat > release-unsigned/release-info.json <<EOF
          {
            "packageId": "com.vectevo.deep_sky",
            "versionName": "${{ inputs.version_name }}",
            "versionCode": ${{ inputs.version_code }},
            "commit": "${{ github.sha }}",
            "unsignedApkSha256": "${UNSIGNED_SHA}"
          }
          EOF

      - name: Upload unsigned release artifacts for local offline signing
        uses: actions/upload-artifact@v7
        with:
          name: deep-sky-unsigned-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: release-unsigned/
          retention-days: 14

  draft-release:
    name: Create or Update Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [build-server-image, build-unsigned-release]
    steps:
      - name: Prepare draft release files
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          COMMIT_SHA: ${{ github.sha }}
          SERVER_IMAGE: ${{ needs.build-server-image.outputs.image }}
          SERVER_DIGEST: ${{ needs.build-server-image.outputs.digest }}
          UNSIGNED_SHA: ${{ needs.build-unsigned-release.outputs.unsigned_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s  app-release-unsigned.apk\n' "$UNSIGNED_SHA" > app-release-unsigned.apk.sha256
          cat > release-info.json <<EOF
          {
            "packageId": "com.vectevo.deep_sky",
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "commit": "${COMMIT_SHA}",
            "unsignedApkSha256": "${UNSIGNED_SHA}",
            "serverImage": "${SERVER_IMAGE}:${VERSION_NAME}",
            "serverImageDigest": "${SERVER_DIGEST}"
          }
          EOF
          cat > release-notes.md <<EOF
          ## Deep Sky v${VERSION_NAME} (build ${VERSION_CODE})

          - **Commit:** \`${COMMIT_SHA}\`
          - **Server image (linux/amd64, linux/arm64):** \`${SERVER_IMAGE}:${VERSION_NAME}\`
          - **Server image digest:** \`${SERVER_DIGEST}\`
          - **Unsigned APK SHA-256:** \`${UNSIGNED_SHA}\`
          - **Workflow run (unsigned APK artifact):** ${RUN_URL}

          ### Before publishing this draft
          1. Download \`deep-sky-unsigned-${VERSION_NAME}-${VERSION_CODE}\` from the workflow run above and verify \`app-release-unsigned.apk.sha256\`.
          2. Sign the APK and generate the signed update manifest offline using \`scripts/sign-release.ps1\` (or \`scripts/sign-release.sh\`).
          3. Upload \`deep-sky-${VERSION_NAME}-${VERSION_CODE}.apk\`, \`manifest.json\`, and \`manifest.json.sig\` to this draft release, then publish.
          EOF

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft)
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Error: Release $TAG is already published. Bump version_name before running."
              exit 1
            fi
            gh release edit "$TAG" \
              --draft \
              --target "$COMMIT_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md
            gh release upload "$TAG" \
              release-info.json \
              app-release-unsigned.apk.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              --draft \
              --target "$COMMIT_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md \
              release-info.json \
              app-release-unsigned.apk.sha256
          fi
