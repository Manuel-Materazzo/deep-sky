title = "Deep Sky Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "firebase-service-account"
description = "Firebase / Google Cloud service account private key JSON"
regex = '''"type"\s*:\s*"service_account"'''
tags = ["firebase", "gcp", "key"]

[[rules]]
id = "deepsky-admin-secret-env"
description = "Hardcoded non-placeholder Deep Sky admin secret"
regex = '''(?i)DEEPSKY_ADMIN_SECRET\s*[:=]\s*["']?([A-Za-z0-9_\-+/=]{12,})'''
secretGroup = 1
keywords = ["deepsky_admin_secret"]
tags = ["deepsky", "secret"]

[[rules.allowlists]]
description = "Allow placeholder and dev-default admin secret values"
regexTarget = "secret"
regexes = [
  '''(?i)^(change-me|placeholder|example|dev-admin-secret-change-me)''',
]

[[allowlists]]
description = "Allow documentation examples and env templates"
paths = [
  '''^deploy/\.env\.example$''',
  '''^docs/''',
]

[[allowlists]]
description = "Allow local secure-storage key identifiers (not secret values)"
condition = "AND"
paths = [
  '''^lib/data/''',
  '''^test/''',
]
regexTarget = "secret"
regexes = [
  '''^deep_sky\.[a-z0-9_.]+\.v[0-9]+$''',
]

[[allowlists]]
description = "Allow golden test mock invite token"
condition = "AND"
paths = [
  '''^test/golden/deep_sky_golden_test\.dart$''',
]
regexTarget = "secret"
regexes = [
  '''^golden_tok_[0-9a-f]+$''',
]
