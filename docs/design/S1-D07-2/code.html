<span class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full bg-tertiary shadow-[0_0_8px_rgba(249,189,34,0.8)]"></span>

<!-- Section 1: User Nickname -->

<label class="flex items-center gap-2 font-headline-sm text-headline-sm text-on-surface" for="user-nickname-input">
<span class="material-symbols-outlined text-[20px] text-primary" style="font-variation-settings: &quot;FILL&quot; 1;">person_pin</span>
          Il tuo nome o vezzeggiativo
        </label>
<span class="font-label-sm text-label-sm text-blush-petal">Visibile a chi ami</span>
</div>
<div class="relative flex items-center">
<input class="w-full bg-night-indigo text-on-surface placeholder:text-on-surface-variant font-body-md text-body-md rounded-xl px-4 py-3.5 outline-none transition-all shadow-inner focus:shadow-[0_0_12px_rgba(244,114,182,0.3)]" id="user-nickname-input" placeholder="es. Luca, Cucciolo, Luccio..." type="text" value="Luca">
<button aria-label="Cancella nome utente" class="absolute right-3 text-on-surface-variant hover:text-on-surface transition-colors p-1" onclick="clearInput('user-nickname-input', 'Tu')" type="button">

</button>

<!-- Actions: Primary & Secondary -->
<div class="flex flex-col space-y-3 pt-2">
<button class="w-full h-14 rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-[0_0_24px_rgba(244,114,182,0.35)] hover:shadow-[0_0_32px_rgba(244,114,182,0.5)] active:scale-[0.98] transition-all" id="submit-names-btn" onclick="handleEnterHouse()" type="button">
<span class="material-symbols-outlined text-[22px] text-on-primary-container" style="font-variation-settings: &quot;FILL&quot; 1;">vpn_key</span>
<span>Tutto pronto, entra nella casa</span>
<span class="material-symbols-outlined text-[18px] text-on-primary-container" style="font-variation-settings: &quot;FILL&quot; 1;">auto_awesome</span>
</button>
<button class="w-full py-2.5 text-center font-label-md text-label-md text-on-surface-variant hover:text-blush-petal active:scale-[0.99] transition-colors" onclick="handleSkip()" type="button">
      Puoi sempre cambiarlo più tardi nelle impostazioni
    </button>
</div>
</div>
<script>
  // DOM preview synchronization
  const userInput = document.getElementById('user-nickname-input');
  const partnerInput = document.getElementById('partner-nickname-input');
  const homeInput = document.getElementById('home-nickname-input');

  const previewUser = document.getElementById('preview-user-tag');
  const previewPartner = document.getElementById('preview-partner-tag');
  const previewHome = document.getElementById('preview-sanctuary-name');

  if (userInput && previewUser) {
    userInput.addEventListener('input', (e) => {
      previewUser.textContent = e.target.value.trim() || 'Tu';
    });
  }

  if (partnerInput && previewPartner) {
    partnerInput.addEventListener('input', (e) => {
      previewPartner.textContent = e.target.value.trim() || 'Chi ami';
    });
  }

  if (homeInput && previewHome) {
    homeInput.addEventListener('input', (e) => {
      previewHome.textContent = e.target.value.trim() || 'Il nostro nido';
    });
  }

  function setNickname(inputId, val) {
    const el = document.getElementById(inputId);
    if (el) {
      el.value = val;
      if (previewUser) previewUser.textContent = val;
    }
  }

  function setPartnerName(val) {
    if (partnerInput) {
      partnerInput.value = val;
      if (previewPartner) previewPartner.textContent = val;
    }
  }

  function setHouseName(val) {
    if (homeInput) {
      homeInput.value = val;
      if (previewHome) previewHome.textContent = val;
    }
  }

  function clearInput(inputId, fallbackVal) {
    const el = document.getElementById(inputId);
    if (el) {
      el.value = '';
      el.focus();
      if (inputId === 'user-nickname-input' && previewUser) previewUser.textContent = fallbackVal;
      if (inputId === 'partner-nickname-input' && previewPartner) previewPartner.textContent = fallbackVal;
      if (inputId === 'home-nickname-input' && previewHome) previewHome.textContent = fallbackVal;
    }
  }

  function handleEnterHouse() {
    const btn = document.getElementById('submit-names-btn');
    if (btn) {
      btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Benvenuti a casa...</span>`;
      btn.disabled = true;
      setTimeout(() => {
        // Smooth transition flow placeholder
        window.location.href = '#sanctuary-room';
      }, 700);
    }
  }

  function handleSkip() {
    window.location.href = '#sanctuary-room';
  }
</script></main>
