<!DOCTYPE html><html class="dark" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300..700;1,6..12,300..700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100%;min-height:100%;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "error-container": "#93000a", "on-surface-variant": "#dac0c9", "inverse-surface": "#eedcfa", "blush-petal": "#fda4af", "primary-fixed-dim": "#ffafd3", "on-primary-fixed-variant": "#85145a", "secondary-fixed-dim": "#ffb2b9", "surface-container-lowest": "#13091e", "night-indigo": "#13091e", "secondary-fixed": "#ffdadc", "night-plum": "#21172c", "surface-container-highest": "#3b3047", "tertiary-fixed-dim": "#f9bd22", "on-tertiary": "#402d00", "on-primary": "#620040", "on-secondary-fixed-variant": "#891933", "error": "#ffb4ab", "surface-bright": "#40344c", "primary-container": "#f472b6", "on-tertiary-container": "#473300", "surface": "#190f24", "on-tertiary-fixed": "#261a00", "night-elevated": "#2f2242", "surface-tint": "#ffafd3", "inverse-primary": "#a43073", "amber-soft": "#fef3c7", "secondary-container": "#891933", "on-secondary-fixed": "#400010", "tertiary-fixed": "#ffdf9f", "primary": "#ffafd3", "tertiary": "#f9bd22", "secondary": "#ffb2b9", "surface-container-low": "#21172c", "blush-mist": "#fff1f2", "on-primary-container": "#6d0047", "on-error": "#690005", "on-secondary-container": "#ff97a3", "inverse-on-surface": "#372c42", "primary-fixed": "#ffd8e7", "outline-variant": "#544249", "on-surface": "#eedcfa", "on-tertiary-fixed-variant": "#5c4300", "on-secondary": "#67001f", "on-error-container": "#ffdad6", "background": "#190f24", "on-primary-fixed": "#3d0026", "blush-soft": "#fbcfe8", "on-background": "#eedcfa", "surface-dim": "#190f24", "surface-container": "#251b31", "surface-variant": "#3b3047", "tertiary-container": "#ca9700", "surface-container-high": "#30253c", "outline": "#a28a93" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "gutter": "1rem", "margin-mobile": "1rem", "space-lg": "1.5rem", "gutter-mobile": "0.75rem", "space-xl": "2rem", "margin": "1.25rem" }, "fontFamily": { "body-lg": ["Nunito Sans"], "headline-md": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "body-sm": ["Nunito Sans"], "headline-xl": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "body-md": ["Nunito Sans"], "headline-sm": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"] }, "fontSize": { "body-lg": ["17px", { "lineHeight": "26px", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }], "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-xl-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }] } } } }</script></head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/70 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-tertiary text-[20px] drop-shadow-[0_0_10px_rgba(251,191,36,0.35)]">nightlight</span><span class="font-headline-sm text-headline-sm text-blush-soft font-semibold tracking-tight">Deep Sky</span></div><div class="flex items-center gap-space-xs"><button aria-label="Help &amp; Information" class="min-w-[44px] min-h-[44px] rounded-full flex items-center justify-center text-on-surface-variant hover:text-tertiary transition-colors" type="button"><span class="material-symbols-outlined text-[20px]">help_outline</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 bg-surface"><div class="flex flex-col w-full">
<div class="px-margin pt-space-sm pb-space-xl flex flex-col gap-space-lg max-w-[640px] mx-auto w-full">
<!-- Navigazione interna / Sottotitolo modale -->

<!-- Segmented Control a 3 schede -->
<div class="flex flex-col items-center text-center py-space-sm px-space-xs">
<div class="relative w-16 h-16 rounded-full bg-night-elevated flex items-center justify-center mb-space-sm shadow-[0_0_24px_4px_rgba(251,191,36,0.2)]">
<span class="material-symbols-outlined text-tertiary text-[32px]" style="font-variation-settings: &quot;FILL&quot; 1;">vpn_key</span>

</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-space-xs font-semibold">
        Ritrova la tua stanza
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
        Hai cambiato telefono o reinstallato l’app? Con le tue 24 parole segrete puoi rientrare nella vostra casa esattamente come l’avete lasciata.
      </p>
</div><div class="p-1 rounded-full bg-surface-container-lowest flex items-center shadow-inner">
<button class="flex-1 py-2 px-3 rounded-full text-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" type="button">
        Invita
      </button>
<button class="flex-1 py-2 px-3 rounded-full text-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" type="button">
        Unisciti
      </button>
<button class="flex-1 py-2 px-3 rounded-full text-center font-label-md text-label-md bg-primary-container text-on-primary-container font-semibold shadow-[0_2px_12px_rgba(244,114,182,0.25)] transition-all" type="button">
        Recupera
      </button>
</div>
<!-- Card Introduttiva ed Emotiva -->

<!-- Sezione Passphrase a 24 parole -->
<div class="rounded-xl bg-surface-container p-space-md flex flex-col gap-space-sm shadow-md">
<div class="flex items-center justify-between">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-blush-petal text-[18px]">key</span>
<span class="font-label-lg text-label-lg text-on-surface">Frase segreta (24 parole)</span>
</div>
<button class="py-1 px-space-sm rounded-full bg-night-elevated hover:bg-surface-bright text-blush-soft font-label-sm text-label-sm flex items-center gap-1 transition-transform active:scale-95 shadow-sm" id="paste-phrase-btn" type="button">
<span class="material-symbols-outlined text-[14px]">content_paste</span>
          Incolla intera frase
        </button>
</div>
<!-- Area di inserimento intelligente con anteprima badge -->
<div class="relative rounded-lg bg-surface-container-lowest p-space-sm flex flex-col gap-space-sm">
<textarea class="w-full bg-transparent text-on-surface font-body-sm text-body-sm placeholder:text-outline focus:outline-none resize-none leading-relaxed" id="passphrase-input" placeholder="Incolla o digita le parole separate da spazio..." rows="3"></textarea>
<!-- Anteprima numerata a scorrimento orizzontale o badge grid -->
<div class="flex flex-wrap gap-1.5 pt-1" id="words-container">




</div>
</div>
<div class="flex items-center gap-space-xs text-on-surface-variant font-body-sm text-body-sm px-1">


</div>
</div>
<!-- Sezione Server di Origine (Self-host / Cloud) -->
<div class="rounded-xl bg-surface-container p-space-md flex flex-col gap-space-sm shadow-md">
<div class="flex items-center justify-between">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-tertiary text-[18px]">dns</span>
<span class="font-label-lg text-label-lg text-on-surface">Server</span>
</div>

</div>
<!-- Scelte Server -->
<div class="grid grid-cols-2 gap-space-xs pt-1">


</div>
<!-- Campo server personalizzato espandibile -->
<div class="flex-col gap-1 pt-space-xs" id="custom-server-field">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="custom-host-input">Host o indirizzo IP locale:</label>
<div class="flex items-center rounded-lg bg-surface-container-lowest px-3 py-2">
<span class="material-symbols-outlined text-outline text-[16px] mr-2">link</span>
<input class="w-full bg-transparent text-on-surface font-body-sm text-body-sm placeholder:text-outline focus:outline-none" id="custom-host-input" placeholder="lanterna.nostradominio.it o 192.168.1.150:8080" type="text">
</div>
</div>

</div>
<!-- Scudo di rispetto, sicurezza & calma -->

<!-- Azione Primaria CTA (Fondo Schermo / Thumb Zone) -->
<div class="pt-space-xs pb-safe">
<button class="w-full py-4 px-space-lg rounded-full bg-primary-container text-on-primary-container font-headline-sm text-headline-sm font-bold flex items-center justify-center gap-space-xs shadow-[0_0_24px_4px_rgba(244,114,182,0.3)] hover:brightness-105 active:scale-[0.98] transition-all" id="restore-button" type="button">
<span class="material-symbols-outlined text-[22px]">magic_button</span>
<span>Ripristina e riaccendi la casa</span>
</button>
</div>
</div>
</div>
<script>
  (function() {
    const defaultBtn = document.getElementById('btn-default-server');
    const customBtn = document.getElementById('btn-custom-server');
    const customField = document.getElementById('custom-server-field');
    const badge = document.getElementById('server-status-badge');
    const pasteBtn = document.getElementById('paste-phrase-btn');
    const input = document.getElementById('passphrase-input');
    const wordsContainer = document.getElementById('words-container');
    const restoreBtn = document.getElementById('restore-button');

    // Toggle selezione Server
    defaultBtn?.addEventListener('click', () => {
      defaultBtn.className = "p-space-sm rounded-lg bg-primary-container text-on-primary-container flex flex-col items-start gap-0.5 text-left shadow-sm transition-all";
      customBtn.className = "p-space-sm rounded-lg bg-surface-container-lowest text-on-surface-variant hover:text-on-surface flex flex-col items-start gap-0.5 text-left transition-all";
      customField?.classList.add('hidden');
      if (badge) badge.textContent = "Predefinito";
    });

    customBtn?.addEventListener('click', () => {
      customBtn.className = "p-space-sm rounded-lg bg-primary-container text-on-primary-container flex flex-col items-start gap-0.5 text-left shadow-sm transition-all";
      defaultBtn.className = "p-space-sm rounded-lg bg-surface-container-lowest text-on-surface-variant hover:text-on-surface flex flex-col items-start gap-0.5 text-left transition-all";
      customField?.classList.remove('hidden');
      if (badge) badge.textContent = "Personale";
    });

    // Incolla fittizio / rapido con feedback morbido
    pasteBtn?.addEventListener('click', async () => {
      const sampleWords = "stella notte cammino lanterna cuscino respiro velluto tazza finestra libro silenzio aurora foglia gatto sussurro pioggia sedia orizzonte chiave radice porto sogno abbraccio rifugio";
      if (input) {
        input.value = sampleWords;
        renderWords(sampleWords);
      }
    });

    input?.addEventListener('input', (e) => {
      renderWords(e.target.value);
    });

    function renderWords(rawText) {
      if (!wordsContainer) return;
      const words = rawText.trim().split(/\s+/).filter(Boolean);
      wordsContainer.innerHTML = '';
      
      const countToShow = Math.min(words.length, 6);
      for (let i = 0; i < countToShow; i++) {
        const chip = document.createElement('span');
        chip.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-night-elevated text-blush-petal font-label-sm text-label-sm";
        chip.innerHTML = `<span class="text-outline text-[10px]">${i+1}</span> ${words[i]}`;
        wordsContainer.appendChild(chip);
      }

      const diff = 24 - words.length;
      const remainBadge = document.createElement('span');
      remainBadge.className = "inline-flex items-center px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm";
      if (diff > 0) {
        remainBadge.textContent = `... ${diff} mancanti`;
      } else if (diff === 0) {
        remainBadge.className = "inline-flex items-center px-2 py-0.5 rounded-full bg-tertiary-container text-on-tertiary-container font-label-sm text-label-sm font-semibold";
        remainBadge.textContent = `✓ 24 parole complete`;
      } else {
        remainBadge.textContent = `${words.length} parole rilevate`;
      }
      wordsContainer.appendChild(remainBadge);
    }

    // Feedback al tocco per pulsante primario
    restoreBtn?.addEventListener('click', () => {
      restoreBtn.innerHTML = `
        <span class="material-symbols-outlined text-[22px] animate-spin">progress_activity</span>
        <span>Riaccendendo la lanterna...</span>
      `;
      setTimeout(() => {
        restoreBtn.innerHTML = `
          <span class="material-symbols-outlined text-[22px]">favorite</span>
          <span>Bentornati a casa</span>
        `;
      }, 1400);
    });
  })();
</script></main>


</body></html>
