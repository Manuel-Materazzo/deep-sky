# Local development database used by spring-boot-docker-compose (SRV-01, INF-04)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deepsky_dev
      POSTGRES_USER: deepsky_dev
      POSTGRES_PASSWORD: deepsky_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - deepsky_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepsky_dev -d deepsky_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  deepsky_dev_pg:
