spring:
  application:
    name: deep-sky-server
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

server:
  shutdown: graceful
  forward-headers-strategy: native

deepsky:
  domain: ${DEEPSKY_DOMAIN:localhost}
  admin-secret: ${DEEPSKY_ADMIN_SECRET:dev-admin-secret-change-me}
  protocol:
    min-client-version-code: ${DEEPSKY_MIN_CLIENT_VERSION_CODE:1}
    min-protocol-version: ${DEEPSKY_MIN_PROTOCOL_VERSION:1}
  quotas:
    max-blob-bytes: ${DEEPSKY_MAX_BLOB_BYTES:10485760}
    max-couple-storage-bytes: ${DEEPSKY_MAX_COUPLE_STORAGE_BYTES:1073741824}
  firebase:
    enabled: ${DEEPSKY_FIREBASE_ENABLED:false}
    project-id: ${DEEPSKY_FIREBASE_PROJECT_ID:}
    api-key: ${DEEPSKY_FIREBASE_API_KEY:}
    app-id: ${DEEPSKY_FIREBASE_APP_ID:}
    sender-id: ${DEEPSKY_FIREBASE_SENDER_ID:}
    service-account-file: ${DEEPSKY_FIREBASE_SERVICE_ACCOUNT_FILE:}
  content:
    packs-dir: ${DEEPSKY_CONTENT_PACKS_DIR:}
    min-pack-version: ${DEEPSKY_MIN_PACK_VERSION:1.0.0}
    # Chiavi pubbliche Ed25519 (base64, raw 32B o SPKI 44B) per la verifica difensiva dei pack.
    # Le voci vuote vengono ignorate; se tutte vuote la verifica della firma lato server e' disattivata.
    trusted-public-keys:
      v1: ${DEEPSKY_CONTENT_TRUSTED_KEY_V1:}
      v2: ${DEEPSKY_CONTENT_TRUSTED_KEY_V2:}
